<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Motion QA Workbench</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body { background: #111; color: #ddd; font: 14px/1.5 monospace; display: flex; flex-direction: column; height: 100vh; }
    header { background: #1a1a2a; padding: 8px 16px; display: flex; align-items: center; gap: 16px; border-bottom: 1px solid #333; }
    header h1 { font-size: 16px; color: #9af; }
    main { display: flex; flex: 1; overflow: hidden; }
    .panel { border-right: 1px solid #333; overflow-y: auto; }
    #library { width: 220px; padding: 8px; }
    #library input { width: 100%; padding: 4px 8px; background: #222; color: #ddd; border: 1px solid #444; border-radius: 4px; margin-bottom: 8px; font: 12px monospace; }
    .pose-item { padding: 4px 8px; cursor: pointer; border-radius: 4px; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pose-item:hover { background: #2a2a3a; }
    .pose-item.selected { background: #335; }
    .pose-item .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
    .dot.pass { background: #5b5; } .dot.fail { background: #b55; } .dot.untested { background: #555; }
    #canvas-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #1a1a1a; }
    #canvas-wrap canvas { border: 1px solid #333; }
    .controls { padding: 8px; display: flex; gap: 8px; align-items: center; }
    .controls button { background: #333; color: #ddd; border: 1px solid #555; border-radius: 4px; padding: 4px 12px; cursor: pointer; font-size: 16px; }
    .controls button:hover { background: #444; }
    .controls button.active { background: #446; border-color: #66a; }
    .dir-btn { font-size: 11px !important; padding: 2px 6px !important; min-width: 28px; }
    #details { width: 340px; padding: 12px; overflow-y: auto; }
    #details h3 { color: #9af; margin: 12px 0 6px; }
    #details h3:first-child { margin-top: 0; }
    #details pre { background: #1a1a1a; padding: 8px; border-radius: 4px; font-size: 11px; overflow-x: auto; white-space: pre-wrap; max-height: 200px; overflow-y: auto; }
    #critique-box { width: 100%; min-height: 60px; padding: 6px 8px; background: #1a1a2a; color: #ddd; border: 1px solid #444; border-radius: 4px; font: 12px monospace; resize: vertical; }
    #btn-fix { background: #644; color: #fcc; border: 1px solid #855; border-radius: 4px; padding: 6px 16px; cursor: pointer; margin-top: 6px; width: 100%; }
    #btn-fix:hover { background: #755; }
    #btn-approve { background: #464; color: #cfc; border: 1px solid #585; border-radius: 4px; padding: 6px 16px; cursor: pointer; margin-top: 4px; width: 100%; display: none; }
    #btn-approve:hover { background: #575; }
    #critique-status { font-size: 11px; color: #888; margin-top: 4px; min-height: 16px; }
    #rules-list { font-size: 11px; color: #a9a; max-height: 150px; overflow-y: auto; }
    #rules-list .rule { padding: 4px 0; border-bottom: 1px solid #222; }
    #command-bar { background: #1a1a2a; padding: 8px 16px; border-top: 1px solid #333; display: flex; gap: 8px; }
    #command-bar input { flex: 1; padding: 6px 10px; background: #222; color: #ddd; border: 1px solid #444; border-radius: 4px; font: 13px monospace; }
    #command-bar button { background: #446; color: #ddd; border: 1px solid #556; border-radius: 4px; padding: 6px 16px; cursor: pointer; }
    .status { padding: 4px 8px; font-size: 12px; color: #888; }
    .section-label { font-size: 10px; color: #666; text-transform: uppercase; letter-spacing: 1px; margin: 8px 0 4px; }
  </style>
</head>
<body>
  <header>
    <h1>Motion QA Workbench</h1>
    <span class="status" id="status">Loading...</span>
    <label style="font-size:11px;color:#888;margin-left:auto">Model:
      <select id="model-select" style="background:#222;color:#ddd;border:1px solid #444;border-radius:3px;padding:2px 4px;font:11px monospace">
        <optgroup label="GPT-5 (newest)">
          <option value="gpt-5.5">gpt-5.5</option>
          <option value="gpt-5">gpt-5</option>
          <option value="gpt-5-mini">gpt-5-mini</option>
        </optgroup>
        <optgroup label="GPT-4.5 / 4o">
          <option value="gpt-4.5">gpt-4.5</option>
          <option value="gpt-4o" selected>gpt-4o</option>
          <option value="gpt-4o-mini">gpt-4o-mini</option>
        </optgroup>
        <optgroup label="Reasoning (o-series)">
          <option value="o3-pro">o3-pro</option>
          <option value="o3">o3</option>
          <option value="o3-mini">o3-mini</option>
          <option value="o1">o1</option>
        </optgroup>
        <optgroup label="GPT-4.1 family">
          <option value="gpt-4.1">gpt-4.1</option>
          <option value="gpt-4.1-mini">gpt-4.1-mini</option>
          <option value="gpt-4.1-nano">gpt-4.1-nano</option>
        </optgroup>
      </select>
    </label>
  </header>
  <main>
    <div class="panel" id="library">
      <input type="text" id="filter" placeholder="Filter poses..." />
      <div class="section-label">POSES</div>
      <div id="pose-list"></div>
      <div class="section-label" style="margin-top:12px">CHOREOGRAPHIES</div>
      <div id="choreo-list"></div>
    </div>
    <div id="canvas-wrap">
      <canvas id="preview" width="400" height="600"></canvas>
      <div class="controls">
        <button id="btn-prev" title="Previous frame">&#9664;&#9664;</button>
        <button id="btn-play" title="Play/Pause">&#9654;</button>
        <button id="btn-next" title="Next frame">&#9654;&#9654;</button>
        <button id="btn-loop" title="Toggle loop">&#8635;</button>
        <span class="status" id="frame-info">-</span>
      </div>
      <div class="controls" id="dir-bar">
        <span style="font-size:11px;color:#666">DIR:</span>
        <button class="dir-btn active" data-dir="s">S</button>
        <button class="dir-btn" data-dir="sw">SW</button>
        <button class="dir-btn" data-dir="w">W</button>
        <button class="dir-btn" data-dir="nw">NW</button>
        <button class="dir-btn" data-dir="n">N</button>
        <button class="dir-btn" data-dir="ne">NE</button>
        <button class="dir-btn" data-dir="e">E</button>
        <button class="dir-btn" data-dir="se">SE</button>
      </div>
    </div>
    <div class="panel" id="details">
      <h3 id="detail-title">Select a pose</h3>
      <div id="detail-desc"></div>
      <h3>Joints</h3>
      <pre id="detail-json">{}</pre>
      <h3>Tags</h3>
      <div id="detail-tags" style="font-size:12px;color:#aaa"></div>

      <h3>Critique</h3>
      <textarea id="critique-box" placeholder="Describe what's wrong with this pose...&#10;e.g. 'the arms are clipping through the torso'&#10;or 'this doesn't look like a salute at all'"></textarea>
      <button id="btn-fix">Fix with LLM</button>
      <button id="btn-approve">Approve &amp; Save Rule</button>
      <div id="critique-status"></div>

      <h3>Learned Rules</h3>
      <div id="rules-list"></div>
      <div style="margin-top:12px;display:flex;gap:4px">
        <button onclick="navigator.clipboard.writeText(JSON.stringify(poses,null,2)).then(()=>document.getElementById('critique-status').textContent='Copied poses JSON to clipboard — paste into poses.json')" style="flex:1;font-size:10px;padding:4px;background:#333;color:#aaa;border:1px solid #444;border-radius:3px;cursor:pointer">Copy poses</button>
        <button onclick="localStorage.removeItem('motion_poses_override');location.reload()" style="flex:1;font-size:10px;padding:4px;background:#333;color:#aaa;border:1px solid #444;border-radius:3px;cursor:pointer">Reset to file</button>
      </div>
    </div>
  </main>
  <div id="command-bar">
    <input type="text" id="command" placeholder="Type a motion command to generate..." />
    <button id="btn-generate">Generate</button>
  </div>
  <script type="module">
    import { solvePose } from '/src/life/pose.js';
    import { drawPose } from '/src/life/eval/stick-renderer.js';

    const DRAW_ORDER = ['thigh_l','shin_l','foot_l','thigh_r','shin_r','foot_r','spine','arm_u_l','arm_f_l','hand_l','arm_u_r','arm_f_r','hand_r','head'];
    const BONE_COLORS = { spine:'#e0e0e0',head:'#f0d060',arm_u_l:'#6090e0',arm_f_l:'#6090e0',hand_l:'#6090e0',arm_u_r:'#4070c0',arm_f_r:'#4070c0',hand_r:'#4070c0',thigh_l:'#50b050',shin_l:'#50b050',foot_l:'#50b050',thigh_r:'#308030',shin_r:'#308030',foot_r:'#308030' };

    let rig = null;
    let poses = [];
    let rules = [];
    let selectedPose = null;
    let pendingFix = null; // { originalJoints, newJoints, critique, rule }

    // Choreography playback state
    let choreoFrames = null; // [{joints, label}]
    let choreoIdx = 0;
    let playing = false;
    let looping = false;
    let playTimer = null;

    // ── LLM config ──────────────────────────────────────────────────────────
    function getLLMConfig() {
      try { return JSON.parse(localStorage.getItem('motion_llm')); } catch { return null; }
    }

    // ── Init ────────────────────────────────────────────────────────────────
    async function init() {
      rig = await (await fetch('/src/life/rigs/humanoid.json')).json();
      // Load poses from localStorage override if available, else from file
      const savedPoses = localStorage.getItem('motion_poses_override');
      if (savedPoses) {
        try { poses = JSON.parse(savedPoses); } catch { poses = []; }
        console.log('[QA] Loaded poses from localStorage override');
      }
      if (!poses.length) {
        poses = await (await fetch('/src/life/choreography/poses.json')).json();
      }
      loadRules();
      document.getElementById('status').textContent = `${poses.length} poses, ${rules.length} rules`;
      renderList();
      renderRules();
      if (poses.length) selectPose(poses[0]);
      loadChoreoList();
      loadSavedGenerations();
    }

    function savePoses() {
      localStorage.setItem('motion_poses_override', JSON.stringify(poses));
      console.log('[QA] Poses saved to localStorage. To write to disk, run in console:');
      console.log('copy(localStorage.getItem("motion_poses_override"))');
      console.log('Then paste into src/life/choreography/poses.json');
    }

    // ── Rules persistence ───────────────────────────────────────────────────
    function loadRules() {
      try { rules = JSON.parse(localStorage.getItem('motion_eval_rules') || '[]'); } catch { rules = []; }
    }
    function saveRules() {
      localStorage.setItem('motion_eval_rules', JSON.stringify(rules));
      renderRules();
      document.getElementById('status').textContent = `${poses.length} poses, ${rules.length} rules`;
    }
    function renderRules() {
      const el = document.getElementById('rules-list');
      if (!rules.length) { el.innerHTML = '<div style="color:#555">No rules yet. Critique a pose to teach the system.</div>'; return; }
      el.innerHTML = rules.map((r, i) => `<div class="rule">${i + 1}. ${r.rule}</div>`).join('');
    }

    // ── Pose list ───────────────────────────────────────────────────────────
    function renderList(filter = '') {
      const list = document.getElementById('pose-list');
      const f = filter.toLowerCase();
      list.innerHTML = poses
        .filter(p => !f || p.id.includes(f) || p.tags.some(t => t.includes(f)))
        .map(p => {
          const cls = p.verified ? 'pass' : 'untested';
          return `<div class="pose-item" data-id="${p.id}"><span class="dot ${cls}"></span>${p.id}</div>`;
        }).join('');
      list.querySelectorAll('.pose-item').forEach(el => {
        el.onclick = () => { stopPlayback(); selectPose(poses.find(p => p.id === el.dataset.id)); };
      });
    }

    function selectPose(p) {
      selectedPose = p;
      pendingFix = null;
      // Build choreoFrames from ALL poses so play/step navigates the library
      choreoFrames = poses.map(pp => ({ joints: pp.joints, label: pp.id, ticks: 5, _poseRef: pp }));
      choreoIdx = poses.indexOf(p);
      document.querySelectorAll('.pose-item').forEach(el => el.classList.toggle('selected', el.dataset.id === p.id));
      document.getElementById('detail-title').textContent = p.id;
      document.getElementById('detail-desc').textContent = p.desc;
      document.getElementById('detail-json').textContent = JSON.stringify(p.joints, null, 2);
      document.getElementById('detail-tags').textContent = p.tags.join(', ');
      document.getElementById('critique-box').value = '';
      document.getElementById('critique-status').textContent = '';
      document.getElementById('btn-approve').style.display = 'none';
      document.getElementById('frame-info').textContent = `${choreoIdx + 1}/${poses.length} poses`;
      drawPreview(p.joints);
    }

    // ── Choreography list ───────────────────────────────────────────────────
    async function loadChoreoList() {
      const list = document.getElementById('choreo-list');
      // Try to load manifest
      try {
        const mod = await import('/src/life/choreography/manifest.js');
        const manifest = mod.MOTION_MANIFEST;
        list.innerHTML = manifest.map(m =>
          `<div class="pose-item" data-choreo="${m.id}"><span class="dot untested"></span>${m.id}</div>`
        ).join('');
        list.querySelectorAll('[data-choreo]').forEach(el => {
          el.onclick = () => loadChoreo(el.dataset.choreo);
        });
      } catch { list.innerHTML = '<div style="color:#555;font-size:11px">No manifest</div>'; }
    }

    async function loadChoreo(id) {
      try {
        const res = await fetch(`/src/life/choreography/${id}.json`);
        if (!res.ok) throw new Error(res.status);
        const program = await res.json();
        // Extract keyframes from the program tree
        const frames = extractFrames(program.root);
        if (!frames.length) { document.getElementById('critique-status').textContent = 'No pose frames found'; return; }
        choreoFrames = frames;
        choreoIdx = 0;
        selectedPose = null;
        pendingFix = null;
        document.querySelectorAll('.pose-item').forEach(el => el.classList.remove('selected'));
        document.querySelectorAll(`[data-choreo="${id}"]`).forEach(el => el.classList.add('selected'));
        document.getElementById('detail-title').textContent = id;
        document.getElementById('detail-desc').textContent = `Choreography: ${frames.length} keyframes`;
        document.getElementById('detail-tags').textContent = '';
        document.getElementById('critique-box').value = '';
        document.getElementById('critique-status').textContent = '';
        document.getElementById('btn-approve').style.display = 'none';
        showFrame(0);
      } catch (e) {
        document.getElementById('critique-status').textContent = `Load error: ${e.message}`;
      }
    }

    function extractFrames(node) {
      if (!node) return [];
      if (node.op === 'pose') return [{ joints: node.joints || {}, label: `${node.ticks}t`, ticks: node.ticks }];
      if (node.op === 'wait') return [{ joints: {}, label: `wait ${node.ticks}t`, ticks: node.ticks }];
      if (node.op === 'sequence') return node.children.flatMap(c => extractFrames(c));
      if (node.op === 'parallel') {
        // Merge parallel children into combined frame
        const merged = {};
        let maxTicks = 1;
        for (const c of node.children) {
          const sub = extractFrames(c);
          for (const f of sub) { Object.assign(merged, f.joints); maxTicks = Math.max(maxTicks, f.ticks || 1); }
        }
        return [{ joints: merged, label: `par ${maxTicks}t`, ticks: maxTicks }];
      }
      return [];
    }

    function showFrame(idx) {
      if (!choreoFrames) return;
      choreoIdx = Math.max(0, Math.min(idx, choreoFrames.length - 1));
      const f = choreoFrames[choreoIdx];
      drawPreview(f.joints);
      document.getElementById('detail-json').textContent = JSON.stringify(f.joints, null, 2);
      document.getElementById('frame-info').textContent = `${choreoIdx + 1}/${choreoFrames.length} (${f.label})`;
      // If stepping through pose library, update the details panel + selection
      if (f._poseRef) {
        selectedPose = f._poseRef;
        document.getElementById('detail-title').textContent = f._poseRef.id;
        document.getElementById('detail-desc').textContent = f._poseRef.desc;
        document.getElementById('detail-tags').textContent = f._poseRef.tags.join(', ');
        document.querySelectorAll('.pose-item').forEach(el => el.classList.toggle('selected', el.dataset.id === f._poseRef.id));
        // Scroll selected into view
        document.querySelector('.pose-item.selected')?.scrollIntoView({ block: 'nearest' });
      }
    }

    // ── Playback controls ───────────────────────────────────────────────────
    function startPlayback() {
      if (!choreoFrames || choreoFrames.length < 2) return;
      playing = true;
      document.getElementById('btn-play').textContent = '\u23F8'; // pause
      document.getElementById('btn-play').classList.add('active');
      tick();
    }

    function stopPlayback() {
      playing = false;
      if (playTimer) { clearTimeout(playTimer); playTimer = null; }
      document.getElementById('btn-play').textContent = '\u25B6'; // play
      document.getElementById('btn-play').classList.remove('active');
    }

    function tick() {
      if (!playing || !choreoFrames || !choreoFrames.length) { stopPlayback(); return; }
      if (choreoIdx >= choreoFrames.length) {
        if (looping) { choreoIdx = 0; } else { stopPlayback(); return; }
      }
      const f = choreoFrames[choreoIdx];
      if (!f) { stopPlayback(); return; }
      const ms = (f.ticks || 3) * 100; // 10 ticks/sec
      showFrame(choreoIdx);
      choreoIdx++;
      playTimer = setTimeout(tick, ms);
    }

    document.getElementById('btn-play').onclick = () => {
      if (playing) stopPlayback(); else startPlayback();
    };
    document.getElementById('btn-prev').onclick = () => { stopPlayback(); showFrame(choreoIdx - 1); };
    document.getElementById('btn-next').onclick = () => { stopPlayback(); showFrame(choreoIdx + 1); };
    document.getElementById('btn-loop').onclick = () => {
      looping = !looping;
      document.getElementById('btn-loop').classList.toggle('active', looping);
    };

    // ── Direction projection (matches game renderer DIRS table) ────────────
    const DIRS = {
      s:  { xProj: 1,    xSign: -1, label: 'South (front)' },
      n:  { xProj: 1,    xSign: +1, label: 'North (back)' },
      e:  { xProj: 0.25, xSign: -1, label: 'East (profile R)' },
      w:  { xProj: 0.25, xSign: +1, label: 'West (profile L)' },
      se: { xProj: 0.75, xSign: -1, label: 'SE (3/4 front-right)' },
      sw: { xProj: 0.75, xSign: +1, label: 'SW (3/4 front-left)' },
      ne: { xProj: 0.75, xSign: -1, label: 'NE (3/4 back-right)' },
      nw: { xProj: 0.75, xSign: +1, label: 'NW (3/4 back-left)' },
    };
    let currentDir = 's';

    document.querySelectorAll('.dir-btn').forEach(btn => {
      btn.onclick = () => {
        currentDir = btn.dataset.dir;
        document.querySelectorAll('.dir-btn').forEach(b => b.classList.toggle('active', b === btn));
        // Redraw current view
        const joints = selectedPose ? selectedPose.joints : (choreoFrames ? choreoFrames[choreoIdx]?.joints : {});
        if (joints) drawPreview(joints);
      };
    });

    // ── Drawing ─────────────────────────────────────────────────────────────
    function drawPreview(joints) {
      const canvas = document.getElementById('preview');
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#1a1a1a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const dir = DIRS[currentDir];
      // Apply directional projection: scale x by xProj, flip x by xSign
      // This simulates how the game renderer shows the avatar from different angles
      const projectedJoints = { ...joints };
      drawPoseDirectional(ctx, rig, projectedJoints, 0, 0, canvas.width, canvas.height, dir);

      // Direction label
      ctx.fillStyle = '#555';
      ctx.font = '11px monospace';
      ctx.textAlign = 'right';
      ctx.fillText(dir.label, canvas.width - 8, 16);
    }

    /** Draw pose with directional x-projection (xProj flattens depth, xSign mirrors). */
    function drawPoseDirectional(ctx, rig, joints, x, y, w, h, dir) {
      const solved = solvePose(rig, joints);

      // Compute bounds with projection applied
      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      const project = (pt) => ({ x: dir.xSign * pt.x * dir.xProj, y: pt.y });
      for (const name of DRAW_ORDER) {
        const b = solved[name];
        for (const pt of [project(b.origin), project(b.tip)]) {
          if (pt.x < minX) minX = pt.x; if (pt.x > maxX) maxX = pt.x;
          if (pt.y < minY) minY = pt.y; if (pt.y > maxY) maxY = pt.y;
        }
      }
      const rigW = maxX - minX || 1, rigH = maxY - minY || 1;
      const scale = Math.min(w * 0.7 / rigW, h * 0.7 / rigH);
      const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
      const ocx = x + w / 2, ocy = y + h / 2;
      const toC = (rx, ry) => ({ cx: ocx + (rx - cx) * scale, cy: ocy - (ry - cy) * scale });
      const toCP = (pt) => toC(pt.x, pt.y);

      // Ground line
      const footY = Math.min(project(solved.foot_l.tip).y, project(solved.foot_r.tip).y);
      const gnd = toC(cx, footY);
      ctx.save(); ctx.strokeStyle = '#555'; ctx.lineWidth = 1; ctx.setLineDash([4,4]);
      ctx.beginPath(); ctx.moveTo(x, gnd.cy); ctx.lineTo(x+w, gnd.cy); ctx.stroke();
      ctx.setLineDash([]); ctx.restore();

      // Bones
      for (const name of DRAW_ORDER) {
        const b = solved[name];
        const col = BONE_COLORS[name] || '#fff';
        const o = toCP(project(b.origin));
        const t = toCP(project(b.tip));
        ctx.beginPath(); ctx.strokeStyle = col; ctx.lineWidth = 3;
        ctx.moveTo(o.cx, o.cy); ctx.lineTo(t.cx, t.cy); ctx.stroke();
        ctx.beginPath(); ctx.fillStyle = col;
        ctx.arc(o.cx, o.cy, 4, 0, Math.PI*2); ctx.fill();
      }
      // Head
      const ht = toCP(project(solved.head.tip));
      ctx.beginPath(); ctx.strokeStyle = '#f0d060'; ctx.lineWidth = 2;
      ctx.arc(ht.cx, ht.cy, 8, 0, Math.PI*2); ctx.stroke();
    }

    // ── Critique → Fix → Learn ──────────────────────────────────────────────
    document.getElementById('btn-fix').onclick = async () => {
      const critique = document.getElementById('critique-box').value.trim();
      if (!critique) { document.getElementById('critique-status').textContent = 'Type a critique first'; return; }

      const cfg = getLLMConfig();
      if (!cfg?.key) { document.getElementById('critique-status').textContent = 'No LLM key configured'; return; }

      // Use the LATEST joints — from pending fix if we're iterating, else from current view
      const currentFrame = choreoFrames?.[choreoIdx];
      const currentJoints = pendingFix ? pendingFix.newJoints
        : (selectedPose?.joints ?? currentFrame?.joints ?? {});
      const poseId = selectedPose?.id || currentFrame?.label || 'unknown';
      const poseDesc = selectedPose?.desc || (document.getElementById('detail-title').textContent) || '';

      document.getElementById('critique-status').textContent = 'Sending to LLM...';
      document.getElementById('btn-fix').disabled = true;

      // Get the stick figure as base64 for the vision model
      const canvas = document.getElementById('preview');
      const base64 = canvas.toDataURL('image/png').split(',')[1];

      // Build rules context — only include rules that seem relevant to this pose
      // (filter by checking if any rule keywords overlap with the pose's tags/id/desc)
      const poseContext = `${poseId} ${poseDesc} ${(selectedPose?.tags || []).join(' ')}`.toLowerCase();
      const relevantRules = rules.filter(r => {
        const rWords = r.rule.toLowerCase().split(/\s+/);
        return rWords.some(w => w.length > 3 && poseContext.includes(w));
      });
      const rulesText = relevantRules.length ? '\n\nRELEVANT LEARNED RULES:\n' + relevantRules.map((r, i) => `${i + 1}. ${r.rule}`).join('\n') : '';

      const systemPrompt = `You are a pose correction expert for a 2D humanoid stick figure rig.
The stick figure is viewed from the SIDE. The colored lines represent bones:
- White = spine (vertical trunk)
- Yellow = head (on top of spine)
- Blue = left arm bones (viewer's right side), darker blue = right arm bones (viewer's left side)
- Green = left leg bones (viewer's right side), darker green = right leg bones (viewer's left side)
- Circles = joints, dashed line = ground level

JOINTS, their limits, and what they DO:
- spine: [-30, 30] — negative leans the TORSO forward, positive leans back
- head: [-60, 60] — negative tilts head down, positive tilts up
- arm_u_l: [-170, 50] — the LEFT upper arm. Negative raises it UP/FORWARD. At -90 it's horizontal forward. At -170 it's overhead.
- arm_f_l: [-140, 0] — LEFT forearm bend. More negative = more bent at elbow.
- hand_l: [-45, 45] — LEFT wrist
- arm_u_r: [-50, 170] — the RIGHT upper arm. POSITIVE raises it UP/FORWARD. At 90 it's horizontal. At 170 it's overhead.
- arm_f_r: [0, 140] — RIGHT forearm bend. More positive = more bent at elbow.
- hand_r: [-45, 45] — RIGHT wrist
- thigh_l: [-110, 30] — LEFT thigh. Negative lifts the leg UP/FORWARD. At -90 the thigh is horizontal.
- shin_l: [0, 140] — LEFT shin/knee bend. More positive = more bent. At 130+ the shin folds back against the thigh (kneeling).
- foot_l: [-30, 30] — LEFT ankle
- thigh_r, shin_r, foot_r: same as left side

CRITICAL: At rest (all joints = 0), the figure stands upright with arms hanging down and legs straight.

You will see the stick figure image AND the current joint angles. The user's critique tells you what's wrong.
Fix the joint angles to match what the pose SHOULD look like based on the critique.

IMPORTANT: Return ALL 14 joint values in your response, not just the ones you changed. Joints you don't mention will be set to 0 (rest), which will reset limbs to hanging straight down. Always include every joint.

Also extract a GENERAL RULE from this critique that would help avoid similar issues in ALL future poses.${rulesText}

Respond in EXACTLY this JSON format. Fill in the CORRECTED values (do NOT just copy zeros):
{"joints": {"spine":___,"head":___,"arm_u_l":___,"arm_f_l":___,"hand_l":___,"arm_u_r":___,"arm_f_r":___,"hand_r":___,"thigh_l":___,"thigh_r":___,"shin_l":___,"shin_r":___,"foot_l":___,"foot_r":___}, "rule": "___"}

No markdown, no explanation. Just the JSON.`;

      // Build ALL current joints with defaults for any missing
      const allJoints = { spine:0, head:0, arm_u_l:0, arm_f_l:0, hand_l:0, arm_u_r:0, arm_f_r:0, hand_r:0, thigh_l:0, thigh_r:0, shin_l:0, shin_r:0, foot_l:0, foot_r:0, ...currentJoints };

      const userMsg = [
        { type: 'text', text: `Pose: "${poseId}" — "${poseDesc}"

CURRENT joint angles (this is what the stick figure shows — these are WRONG and need fixing):
${JSON.stringify(allJoints, null, 2)}

USER CRITIQUE (what's wrong with this pose):
"${critique}"

Now return the CORRECTED joint angles that fix the critique. Start from the current values above and adjust the joints that need changing. Keep joints that are fine at their current values.` },
        { type: 'image_url', image_url: { url: `data:image/png;base64,${base64}` } },
      ];

      try {
        const isOpenAI = !cfg.key.startsWith('sk-ant-');
        const url = cfg.url || (isOpenAI ? 'https://api.openai.com/v1/chat/completions' : 'https://api.anthropic.com/v1/messages');
        const model = document.getElementById('model-select').value;

        const headers = isOpenAI
          ? { 'Content-Type': 'application/json', 'Authorization': `Bearer ${cfg.key}` }
          : { 'Content-Type': 'application/json', 'x-api-key': cfg.key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' };

        const body = isOpenAI
          ? { model, max_completion_tokens: 500, messages: [{ role: 'system', content: systemPrompt }, { role: 'user', content: userMsg }] }
          : { model, max_completion_tokens: 500, system: systemPrompt, messages: [{ role: 'user', content: userMsg.map(p => p.type === 'image_url' ? { type: 'image', source: { type: 'base64', media_type: 'image/png', data: base64 } } : p) }] };

        document.getElementById('critique-status').textContent = `Sending to ${model}...`;
        console.log(`[QA] Sending critique to ${model}...`, { poseId, critique, allJoints });
        const res = await fetch(url, { method: 'POST', headers, body: JSON.stringify(body) });
        if (!res.ok) throw new Error(`API ${res.status}: ${(await res.text()).slice(0, 200)}`);
        const data = await res.json();
        const text = isOpenAI ? (data.choices?.[0]?.message?.content || '') : (data.content?.[0]?.text || '');
        console.log('[QA] Raw LLM response:', text);
        if (!text || text.startsWith("I'm sorry") || text.startsWith("I cannot")) {
          throw new Error(`Model refused or returned empty: "${text.slice(0, 80)}"`);
        }
        const jsonStr = text.replace(/^```json?\s*/m, '').replace(/\s*```$/m, '').trim();
        const result = JSON.parse(jsonStr);
        if (!result.joints) throw new Error('LLM response missing "joints" field');
        console.log('[QA] Parsed result:', result);
        console.log('[QA] New joints:', result.joints);

        // Verify the LLM actually changed something
        const changed = Object.entries(result.joints).filter(([k, v]) => (allJoints[k] ?? 0) !== v);
        console.log('[QA] Changed joints:', changed);

        // Show the fix
        pendingFix = { originalJoints: { ...allJoints }, newJoints: result.joints, critique, rule: result.rule };
        drawPreview(result.joints);
        document.getElementById('detail-json').textContent = JSON.stringify(result.joints, null, 2);
        document.getElementById('btn-approve').style.display = 'block';

        // Auto-learn the rule immediately (don't wait for Approve)
        if (result.rule && result.rule !== '___') {
          rules.push({ rule: result.rule, source: `${model} critique of ${poseId}: "${critique}"`, date: new Date().toISOString().slice(0, 10) });
          saveRules();
          renderRules();
        }
        document.getElementById('critique-status').textContent = `${model}: ${changed.length} joints changed. Rule: "${result.rule}"`;
        // Clear the critique box so next critique is fresh
        document.getElementById('critique-box').value = '';
      } catch (e) {
        document.getElementById('critique-status').textContent = `Error: ${e.message}`;
      }
      document.getElementById('btn-fix').disabled = false;
    };

    // ── Approve: save fix + learn rule ──────────────────────────────────────
    document.getElementById('btn-approve').onclick = () => {
      if (!pendingFix) return;

      // Update the pose in the poses array (in-place mutation)
      if (selectedPose) {
        selectedPose.joints = { ...pendingFix.newJoints };
        selectedPose.verified = true;
        // Also update the choreoFrames entry if we're in pose-browse mode
        if (choreoFrames) {
          const frame = choreoFrames.find(f => f._poseRef === selectedPose);
          if (frame) frame.joints = { ...pendingFix.newJoints };
        }
      }

      // Save the rule
      rules.push({
        rule: pendingFix.rule,
        source: `critique of ${selectedPose?.id || 'unknown'}: "${pendingFix.critique}"`,
        date: new Date().toISOString().slice(0, 10),
      });
      saveRules();

      // Persist poses to localStorage so changes survive navigation/reload
      savePoses();

      // Update UI
      document.getElementById('btn-approve').style.display = 'none';
      document.getElementById('critique-status').textContent = `Saved! Rule #${rules.length} learned. Pose persisted.`;
      document.getElementById('critique-box').value = '';
      renderList(document.getElementById('filter').value);
      pendingFix = null;
    };

    // ── Generate command ────────────────────────────────────────────────────
    // ── LLM call helper ───────────────────────────────────────────────────
    async function callLLM(systemPrompt, userContent, cfg) {
      const isOpenAI = !cfg.key.startsWith('sk-ant-');
      const url = cfg.url || (isOpenAI ? 'https://api.openai.com/v1/chat/completions' : 'https://api.anthropic.com/v1/messages');
      const model = document.getElementById('model-select').value;
      const headers = isOpenAI
        ? { 'Content-Type': 'application/json', 'Authorization': `Bearer ${cfg.key}` }
        : { 'Content-Type': 'application/json', 'x-api-key': cfg.key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' };
      const body = isOpenAI
        ? { model, max_completion_tokens: 1024, messages: [{ role: 'system', content: systemPrompt }, { role: 'user', content: userContent }] }
        : { model, max_completion_tokens: 1024, system: systemPrompt, messages: [{ role: 'user', content: userContent }] };
      const res = await fetch(url, { method: 'POST', headers, body: JSON.stringify(body) });
      if (!res.ok) throw new Error(`API ${res.status}: ${(await res.text()).slice(0, 200)}`);
      const data = await res.json();
      const text = isOpenAI ? (data.choices?.[0]?.message?.content || '') : (data.content?.[0]?.text || '');
      return text;
    }

    function parseJSON(text) {
      return JSON.parse(text.replace(/^```json?\s*/m, '').replace(/\s*```$/m, '').trim());
    }

    // ── Generate: decompose → create missing poses → compose ────────────────
    document.getElementById('btn-generate').onclick = async () => {
      const cmd = document.getElementById('command').value.trim();
      if (!cmd) return;
      const cfg = getLLMConfig();
      if (!cfg?.key) { document.getElementById('status').textContent = 'No LLM key configured'; return; }
      const model = document.getElementById('model-select').value;
      const id = cmd.toLowerCase().replace(/[^a-z0-9]+/g, '_').slice(0, 40);
      const setStatus = (msg) => { document.getElementById('status').textContent = msg; };

      try {
        // ── STEP 1: Decompose the motion into keyframe descriptions ─────
        setStatus(`Step 1/3: Decomposing "${cmd}" into keyframes...`);
        const poseSummary = poses.map(p => `  ${p.id} — ${p.desc}`).join('\n');
        const rulesText = rules.length ? '\nRULES:\n' + rules.map((r, i) => `${i+1}. ${r.rule}`).join('\n') : '';

        const decomposePrompt = `You decompose human motions into a sequence of keyframe body positions.

EXISTING POSES (use these when possible):
${poseSummary}

For each keyframe, specify:
- "pose": an existing pose id if one matches, OR "NEW:<snake_case_id>:<description of the body position>"
- "ticks": duration (2-6, where 10 ticks = 1 second)

RULES:
1. Start and end with "rest"
2. Break the motion into 4-10 distinct body positions
3. Use existing poses whenever they fit. Only use NEW for positions not in the list.
4. NEW descriptions must be specific about body part positions (e.g. "both arms extended forward, torso bent forward 30 degrees, legs straight")
5. Think anatomically — where is each limb at this moment?${rulesText}

Output JSON: {"id":"<id>","kind":"gesture","steps":[{"pose":"<id or NEW:id:desc>","ticks":<N>},...]}
No markdown.`;

        const decomposeText = await callLLM(decomposePrompt, `Decompose: "${cmd}", id="${id}"`, cfg);
        console.log('[QA] Decompose raw:', decomposeText);
        const plan = parseJSON(decomposeText);
        console.log('[QA] Plan:', plan);

        // ── STEP 2: Create any missing poses ────────────────────────────
        const poseMap = new Map(poses.map(p => [p.id, p]));
        const newPoses = [];
        for (const step of plan.steps) {
          if (step.pose.startsWith('NEW:')) {
            const parts = step.pose.slice(4);
            const colonIdx = parts.indexOf(':');
            const newId = colonIdx >= 0 ? parts.slice(0, colonIdx).trim() : parts.replace(/\s+/g, '_');
            const newDesc = colonIdx >= 0 ? parts.slice(colonIdx + 1).trim() : parts;

            if (poseMap.has(newId)) { step.pose = newId; continue; }

            setStatus(`Step 2/3: Creating pose "${newId}"...`);
            console.log(`[QA] Generating new pose: ${newId} — ${newDesc}`);

            const poseGenPrompt = `You set joint angles for a 2D humanoid stick figure to match a described body position.

JOINTS and their effects:
- spine: [-30, 30] — negative=lean forward, positive=lean back
- head: [-60, 60] — negative=look down, positive=look up
- arm_u_l: [-170, 50] — LEFT upper arm. -90=horizontal forward, -170=overhead
- arm_f_l: [-140, 0] — LEFT forearm bend. More negative=more bent
- hand_l: [-45, 45]
- arm_u_r: [-50, 170] — RIGHT upper arm. 90=horizontal forward, 170=overhead
- arm_f_r: [0, 140] — RIGHT forearm bend. More positive=more bent
- hand_r: [-45, 45]
- thigh_l: [-110, 30] — LEFT thigh. -90=horizontal forward, negative=lift up
- shin_l: [0, 140] — LEFT knee bend. 130+=shin folds against thigh (kneeling)
- foot_l: [-30, 30]
- thigh_r, shin_r, foot_r: same as left side

At rest (all 0): standing upright, arms hanging, legs straight.

Return ALL 14 joints. Think carefully about what EACH body part does in this position.

Respond: {"joints":{"spine":_,"head":_,"arm_u_l":_,"arm_f_l":_,"hand_l":_,"arm_u_r":_,"arm_f_r":_,"hand_r":_,"thigh_l":_,"thigh_r":_,"shin_l":_,"shin_r":_,"foot_l":_,"foot_r":_}}
No markdown.`;

            const poseText = await callLLM(poseGenPrompt, `Create pose for: "${newDesc}"`, cfg);
            console.log(`[QA] Pose gen raw for ${newId}:`, poseText);
            const poseResult = parseJSON(poseText);

            // Add to dictionary
            const newPose = {
              id: newId, joints: poseResult.joints, desc: newDesc,
              tags: newDesc.toLowerCase().split(/\s+/).filter(w => w.length > 2),
              category: 'generated', verified: false,
            };
            poses.push(newPose);
            poseMap.set(newId, newPose);
            newPoses.push(newId);
            step.pose = newId;

            await new Promise(r => setTimeout(r, 300)); // rate limit
          }
        }

        if (newPoses.length) {
          savePoses();
          renderList(document.getElementById('filter').value);
          console.log(`[QA] Created ${newPoses.length} new poses:`, newPoses);
        }

        // ── STEP 3: Compile and display ─────────────────────────────────
        setStatus(`Step 3/3: Composing choreography...`);
        const frames = plan.steps.map(s => {
          const p = poseMap.get(s.pose);
          return { joints: p ? { ...p.joints } : {}, label: s.pose, ticks: s.ticks };
        });

        choreoFrames = frames;
        choreoIdx = 0;
        selectedPose = null;
        pendingFix = null;
        document.getElementById('detail-title').textContent = plan.id || id;
        document.getElementById('detail-desc').textContent = `Generated: ${frames.length} keyframes` + (newPoses.length ? ` (${newPoses.length} new poses created)` : '');
        document.getElementById('detail-tags').textContent = plan.steps.map(s => s.pose).join(' -> ');
        document.getElementById('critique-box').value = '';
        document.getElementById('critique-status').textContent = '';
        document.getElementById('btn-approve').style.display = 'none';
        showFrame(0);

        // Save to generated list
        const generated = JSON.parse(localStorage.getItem('motion_generated_choreos') || '[]');
        const program = {
          id: plan.id || id, kind: plan.kind || 'gesture',
          variant: { time: [0.9, 1.1], amplitude: [0.9, 1.1] },
          root: { op: 'sequence', children: frames.map(f => ({ op: 'pose', joints: f.joints, ticks: f.ticks || 4 })) },
        };
        generated.push({ id: plan.id || id, command: cmd, model, plan, program, newPoses, date: new Date().toISOString().slice(0, 10) });
        localStorage.setItem('motion_generated_choreos', JSON.stringify(generated));
        addGeneratedToList(plan.id || id);

        setStatus(`Generated "${cmd}" via ${model} — ${frames.length} frames, ${newPoses.length} new poses`);
      } catch (e) {
        setStatus(`Error: ${e.message}`);
        console.error('[QA] Generate error:', e);
      }
    };

    // ── Generated choreo list management ──────────────────────────────────
    function addGeneratedToList(id) {
      const list = document.getElementById('choreo-list');
      const el = document.createElement('div');
      el.className = 'pose-item';
      el.dataset.genId = id;
      el.innerHTML = `<span class="dot pass"></span>${id}`;
      el.onclick = () => loadGeneratedChoreo(id);
      list.prepend(el);
    }

    function loadGeneratedChoreo(id) {
      const generated = JSON.parse(localStorage.getItem('motion_generated_choreos') || '[]');
      const entry = generated.find(g => g.id === id);
      if (!entry) return;
      const poseMap = new Map(poses.map(p => [p.id, p]));
      const frames = entry.plan.steps.map(s => {
        const p = poseMap.get(s.pose);
        return { joints: p ? { ...p.joints } : {}, label: s.pose, ticks: s.ticks };
      });
      choreoFrames = frames;
      choreoIdx = 0;
      selectedPose = null;
      pendingFix = null;
      document.querySelectorAll('.pose-item').forEach(el => el.classList.remove('selected'));
      document.querySelector(`[data-gen-id="${id}"]`)?.classList.add('selected');
      document.getElementById('detail-title').textContent = id;
      document.getElementById('detail-desc').textContent = `Generated: ${frames.length} keyframes (${entry.model})`;
      document.getElementById('detail-tags').textContent = entry.plan.steps.map(s => s.pose).join(' -> ');
      document.getElementById('critique-box').value = '';
      document.getElementById('critique-status').textContent = '';
      document.getElementById('btn-approve').style.display = 'none';
      showFrame(0);
    }

    function loadSavedGenerations() {
      const generated = JSON.parse(localStorage.getItem('motion_generated_choreos') || '[]');
      for (const g of generated) addGeneratedToList(g.id);
    }

    // ── Filter ──────────────────────────────────────────────────────────────
    document.getElementById('filter').oninput = (e) => renderList(e.target.value);

    // ── Keyboard shortcuts ──────────────────────────────────────────────────
    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.key === 'ArrowLeft') { stopPlayback(); showFrame(choreoIdx - 1); }
      if (e.key === 'ArrowRight') { stopPlayback(); showFrame(choreoIdx + 1); }
      if (e.key === ' ') { e.preventDefault(); if (playing) stopPlayback(); else startPlayback(); }
    });

    init();
  </script>
</body>
</html>
