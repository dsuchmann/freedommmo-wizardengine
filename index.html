<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FreedomMMO — First Slice</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #05080b; font-family: ui-monospace, Consolas, monospace; }
    canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
    #hud { position: fixed; left: 12px; top: 12px; color: #e8f6ff; background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.18); border-radius: 10px; padding: 10px 12px; line-height: 1.45; font-size: 13px; pointer-events: none; text-shadow: 0 1px 2px #000; }
    #title { color: #9ee7ff; font-weight: 700; font-size: 15px; }
    #copyBtn { background: rgba(60,80,100,.7); color: #e8f6ff; border: 1px solid rgba(255,255,255,.25); border-radius: 4px; padding: 0 6px; margin-left: 6px; font: 11px ui-monospace, Consolas, monospace; cursor: pointer; pointer-events: auto; vertical-align: middle; opacity: .6; transition: opacity .15s; }
    #copyBtn:hover { opacity: 1; background: rgba(80,120,160,.8); }
    #overmapWrap { position: fixed; right: 12px; top: 12px; color: #e8f6ff; background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.18); border-radius: 10px; padding: 8px; font-size: 12px; text-align: center; }
    #overmap { width: 304px; height: 304px; image-rendering: pixelated; cursor: crosshair; border-radius: 6px; }
    #overmapWrap.expanded { position: fixed; inset: 12px; padding: 12px; z-index: 100; border-radius: 14px; display: flex; align-items: center; justify-content: center; flex-direction: column; }
    #overmapWrap.expanded #overmap { width: min(calc(100vw - 48px), calc(100vh - 80px)); height: min(calc(100vw - 48px), calc(100vh - 80px)); border-radius: 10px; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud"><div id="title">FreedomMMO — deterministic world slice<button id="copyBtn" title="Copy debug info">📋</button></div><div id="stats"></div></div>
  <div id="overmapWrap"><canvas id="overmap" width="304" height="304"></canvas><div>click chunk-pixel to teleport · M toggle · F expand<br>yellow pixel = current chunk · white box = loaded chunks</div></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
